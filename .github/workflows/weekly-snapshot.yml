name: Weekly Pricing Snapshot

on:
  schedule:
    - cron: "0 10 * * 1" # Monday 10:00 UTC
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install llm-bench
        run: pip install -e .

      - name: Save pricing snapshot
        run: llm-bench snapshot

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          git diff --staged --quiet || git commit -m "chore: weekly pricing snapshot"
          git push
